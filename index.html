<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Edu+SA+Hand:wght@400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>weather app</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <form class="search-form-input">
          <input
            type="search"
            id="city"
            placeholder="Enter a city..."
            required
            class="searchCity"
          />
          <input type="submit" value="Search" class="search-button" />
        </form>
      </header>
      <main>
        <h1>Paris</h1>
        <div>
          <p>
            Thursday 20:55, moderate rain <br />
            Humidity: 87%, Wind: 7.2km/h
          </p>
        </div>
        <div>☀️ 12°C</div>
      </main>
      <footer>
        This project was coded by
        <a
          href="https://github.com/albamarroschmitt?tab=repositories"
          target="_blank"
          >Alba Marro</a
        >, is open-sourced on
        <a
          href="https://github.com/albamarroschmitt/weather_forecast"
          target="_blank"
          >Github</a
        >
        and hosted on
        <a
          href="https://myweatherforecastappshecodes.netlify.app/"
          target="_blank"
          >Netlify</a
        >
      </footer>
    </div>
  </body>
</html>
